name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Cheap checks: no game data, no Ghidra, no compiler.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Lint the scripts
        run: |
          python3 -m pip install -r requirements-dev.txt
          ruff check .
      - name: Regression tests of the scripts
        run: python3 scripts/test_public_tools.py -v
      - name: Byte-compile the scripts
        run: python3 -m compileall -q scripts
      - name: Shell scripts
        run: shellcheck --severity=error $(git ls-files 'scripts/*.sh' 'scripts/**/*.sh' setup.sh)
      - name: Links in the markdown files
        run: python3 scripts/check_links.py
      - name: The committed PAL data is current
        run: python3 scripts/pal_report.py --check

  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Commit messages and pull request title
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 scripts/commit_msg.py --range "$(git merge-base "$BASE_SHA" HEAD)..HEAD"
          python3 scripts/commit_msg.py --title "$PR_TITLE"
