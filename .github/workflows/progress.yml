# Validates the progress data a change commits (site/data/summary.json, written locally by `make progress`: measuring progress needs
# your own copy of the game, so nothing here builds it) and, on pull requests, prepares the comparison with main for progress-comment.yml.
# Nothing in this workflow has a write token and it never runs the pull request's own scripts on secrets.
name: progress

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validate the committed progress data
        if: github.event_name != 'pull_request'
        run: python3 scripts/progress_comment.py site/data/summary.json site/data/summary.json > /dev/null
      - name: Compare with the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git show "$BASE_SHA:site/data/summary.json" > "$RUNNER_TEMP/base-summary.json" || echo '{}' > "$RUNNER_TEMP/base-summary.json"
          python3 scripts/progress_comment.py "$RUNNER_TEMP/base-summary.json" site/data/summary.json --number "$NUMBER" --output comment
      - name: Hand the comment over
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: progress-comment
          path: comment
