version: 2
updates:
  # The workflows pin actions to commit SHAs; this keeps them current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Splat 0.50 / spimdisasm 1.42 change the assembly format and the symbol rules the build relies on (tried 2026-10: `make elf` fails).
      # Bump them together, by hand, after porting scripts/build and config/us.
      - dependency-name: splat64
      - dependency-name: spimdisasm
    commit-message:
      prefix: "build"
