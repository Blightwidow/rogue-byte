# Tool configuration only: the project is a set of scripts, not a Python package.
[tool.ruff]
line-length = 160
target-version = "py312"
extend-exclude = ["build", "tools", "work", "data"]

[tool.ruff.lint]
# Errors that are bugs: syntax errors, undefined names, misused comparisons and strings. The style of the older workbench
# scripts is left alone; new code follows .clang-format's spirit (four spaces, descriptive names).
select = ["E9", "F63", "F7", "F82", "F811", "F821", "F822", "F823"]
